<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Date Invitation! 🐾</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .dog-container {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <!-- Main Display Card -->
  <div class="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-2xl max-w-md w-full text-center space-y-6 border border-pink-100">
    
    <!-- Golden Retriever Vector Illustration -->
    <div class="dog-container flex justify-center">
      <div class="relative bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl shadow-inner inline-block">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" class="w-36 h-36 mx-auto drop-shadow-sm">
          <!-- Body -->
          <path d="M70,120 Q70,90 90,80 L110,80 Q130,90 130,120 L130,160 L70,160 Z" fill="#E5A967"/>
          <!-- Head Base -->
          <circle cx="100" cy="85" r="45" fill="#F4C085"/>
          <!-- Ears -->
          <path d="M60,65 Q45,90 60,115 Q70,100 65,80 Z" fill="#D49353"/>
          <path d="M140,65 Q155,90 140,115 Q130,100 135,80 Z" fill="#D49353"/>
          <!-- Snout & Nose -->
          <ellipse cx="100" cy="98" rx="20" ry="15" fill="#FCE8D0"/>
          <ellipse cx="100" cy="93" rx="8" ry="6" fill="#3E2723"/>
          <!-- Eyes -->
          <circle cx="85" cy="75" r="4" fill="#3E2723"/>
          <circle cx="115" cy="75" r="4" fill="#3E2723"/>
          <!-- Tongue -->
          <path d="M93,106 Q100,120 107,106 Z" fill="#FF6B81"/>
          <!-- Paws -->
          <ellipse cx="85" cy="150" rx="10" ry="12" fill="#F4C085"/>
          <ellipse cx="115" cy="150" rx="10" ry="12" fill="#F4C085"/>
        </svg>
        <div class="absolute -top-3 -right-2 text-2xl animate-bounce">💌</div>
      </div>
    </div>

    <div>
      <span class="bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Special Invitation</span>
      <h1 class="text-2xl font-bold text-gray-900 mt-3">Would you be willing to go on a date with me?</h1>
      <p class="text-gray-500 text-sm mt-1">Our golden friend is holding the card for you! 🐾</p>
    </div>
    
    <div id="button-container" class="flex justify-center gap-4 pt-2">
      <button id="yesBtn" onclick="handleYes()" class="bg-pink-500 hover:bg-pink-600 text-white font-semibold px-8 py-3 rounded-2xl shadow-lg hover:shadow-pink-500/30 transition-all transform hover:-scale-105 active:scale-95">
        Yes! 💕
      </button>
      <button id="noBtn" onclick="handleNo()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold px-6 py-3 rounded-2xl transition-all">
        No
      </button>
    </div>
  </div>

  <script>
    let noClickCount = 0;
    let formData = {};

    // 🔴 REPLACE YOUR_FORMSPREE_FORM_ID WITH YOUR ACTUAL ID (e.g., xbo3821n) 🔴
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mdeekqpl';

    function handleNo() {
      noClickCount++;
      const yesBtn = document.getElementById('yesBtn');

      if (noClickCount === 1) {
        Swal.fire({
          title: 'Are you sure? 🥺',
          text: 'The golden retriever looks a little sad...',
          icon: 'question',
          confirmButtonText: 'Let me rethink!',
          confirmButtonColor: '#ec4899'
        });
        yesBtn.classList.add('scale-110');
      } else if (noClickCount === 2) {
        Swal.fire({
          title: 'Pretty please? 🐶',
          text: 'Think about all the good food and fun!',
          icon: 'warning',
          confirmButtonText: 'Okay fine, Yes!',
          confirmButtonColor: '#ec4899'
        }).then(() => {
          handleYes();
        });
      }
    }

    async function handleYes() {
      formData.willing = 'Yes';
      const maxDate = '2026-12-20';
      const today = new Date().toISOString().split('T')[0];
      const minDate = today < '2026-01-01' ? '2026-01-01' : today;

      const { value: selectedDate } = await Swal.fire({
        title: 'Yay! 🎉',
        text: 'When are you available? (Until Dec 20, 2026)',
        html: `<input type="date" id="swal-input-date" min="${minDate}" max="${maxDate}" class="swal2-input" value="${minDate <= maxDate ? minDate : maxDate}">`,
        focusConfirm: false,
        confirmButtonText: 'Next ➡️',
        confirmButtonColor: '#ec4899',
        preConfirm: () => {
          const dateVal = document.getElementById('swal-input-date').value;
          if (!dateVal) {
            Swal.showValidationMessage('Please select a valid date!');
          } else if (dateVal > maxDate) {
            Swal.showValidationMessage('Please pick a date on or before December 20, 2026!');
          }
          return dateVal;
        }
      });

      if (selectedDate) {
        formData.date = selectedDate;
        askFoodPreference();
      }
    }

    async function askFoodPreference() {
      const { value: foodPreference } = await Swal.fire({
        title: 'What food do you prefer? 🍽️',
        input: 'select',
        inputOptions: {
          'Chinese': 'Chinese 🥢',
          'Filipino': 'Filipino 🇵🇭',
          'Korean': 'Korean 🇰🇷',
          'Japanese': 'Japanese 🍣',
          'Indian': 'Indian 🍛',
          'American': 'American 🍔',
          'Others': 'Others (Please specify)'
        },
        inputPlaceholder: 'Select cuisine type',
        confirmButtonText: 'Next ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) return 'Please pick a food preference!';
        }
      });

      if (foodPreference === 'Others') {
        askOtherFood();
      } else if (foodPreference) {
        formData.food = foodPreference;
        askPreferredActivity();
      }
    }

    // Editable input dialog for the "Others" option
    async function askOtherFood() {
      const { value: customFood } = await Swal.fire({
        title: 'Specify your preferred cuisine 🍕🍝',
        text: 'Type what you are craving for:',
        input: 'text',
        inputPlaceholder: 'e.g., Italian, Mediterranean, Spanish, Thai...',
        showCancelButton: true,
        cancelButtonText: '⬅️ Back',
        confirmButtonText: 'Save & Next ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value || !value.trim()) {
            return 'Please type your preferred food or cuisine!';
          }
        }
      });

      if (customFood) {
        formData.food = `Others: ${customFood.trim()}`;
        askPreferredActivity();
      } else {
        // If they click Back / Cancel, return to the select dropdown
        askFoodPreference();
      }
    }

    async function askPreferredActivity() {
      const { value: activity } = await Swal.fire({
        title: 'What is your preferred activity? ✨',
        input: 'select',
        inputOptions: {
          'Artsy': '🎨 Artsy (Museums, Painting, Galleries)',
          'Active': '⚡ Active (Bowling, Arcade, Walking tour)',
          'Calm': '☕ Calm (Coffee shop, Quiet dinner, Strolling)'
        },
        inputPlaceholder: 'Select an activity vibe',
        confirmButtonText: 'Show Summary 💕',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) return 'Please pick an activity!';
        }
      });

      if (activity) {
        formData.activity = activity;
        showSummaryAndTulips();
      }
    }

    function showSummaryAndTulips() {
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      const formattedDate = new Date(formData.date).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      Swal.fire({
        title: "It's a Date! 🌷✨",
        html: `
          <div class="text-center space-y-3">
            <div class="flex justify-center my-2">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" class="w-40 h-32">
                <path d="M100,120 Q90,90 80,40" stroke="#4CAF50" stroke-width="4" fill="none"/>
                <path d="M100,120 Q105,85 115,35" stroke="#4CAF50" stroke-width="4" fill="none"/>
                <path d="M100,120 Q80,95 60,50" stroke="#4CAF50" stroke-width="4" fill="none"/>
                <path d="M100,120 Q120,95 140,50" stroke="#4CAF50" stroke-width="4" fill="none"/>
                <path d="M50,45 C45,30 55,20 60,35 C65,20 75,30 70,45 C75,55 55,55 50,45 Z" fill="#FF6B81"/>
                <path d="M70,35 C65,15 85,15 80,35 Z" fill="#FF8E9E"/>
                <path d="M75,30 C70,15 90,10 90,30 C90,45 75,45 75,30 Z" fill="#FF477E"/>
                <path d="M110,25 C110,10 130,15 125,35 C130,20 140,30 135,45 C125,55 110,45 110,25 Z" fill="#FF6B81"/>
                <path d="M135,40 C145,25 155,35 150,50 C155,60 135,60 135,40 Z" fill="#FF8E9E"/>
                <path d="M85,100 L115,100 L125,150 L75,150 Z" fill="#FCE4EC" stroke="#F48FB1" stroke-width="2"/>
                <ellipse cx="100" cy="120" rx="12" ry="8" fill="#E91E63"/>
              </svg>
            </div>

            <div class="text-left bg-pink-50 p-4 rounded-2xl border border-pink-200 space-y-2 text-sm text-gray-700">
              <p>📅 <strong>Date:</strong> ${formattedDate}</p>
              <p>🍽️ <strong>Food:</strong> ${formData.food}</p>
              <p>🎨 <strong>Activity:</strong> ${formData.activity}</p>
            </div>
            
            <p class="text-xs text-gray-500">Clicking below will confirm and send your answer automatically!</p>
          </div>
        `,
        confirmButtonText: 'Confirm & Send 💌',
        confirmButtonColor: '#ec4899',
        allowOutsideClick: false,
        showLoaderOnConfirm: true,
        preConfirm: async () => {
          try {
            const response = await fetch(FORMSPREE_ENDPOINT, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                Willing: formData.willing,
                "Preferred Date": formattedDate,
                "Food Preference": formData.food,
                "Preferred Activity": formData.activity
              })
            });

            if (!response.ok) {
              const errData = await response.json();
              throw new Error(errData.error || 'Submission failed');
            }
            return true;
          } catch (error) {
            Swal.showValidationMessage(`Error: ${error.message}`);
          }
        }
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({
            title: 'Response Sent! ❤️',
            text: 'Your date preferences have been sent directly to Carlo. See you soon!',
            icon: 'success',
            confirmButtonColor: '#ec4899'
          });
        }
      });
    }
  </script>
</body>
</html>
