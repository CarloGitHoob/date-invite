<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Quick Question...</title>
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 for clean popups -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Subtle background animation */
    body {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

  <!-- Main Card -->
  <div class="bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full text-center space-y-6">
    <div class="text-5xl">✨</div>
    <h1 class="text-3xl font-bold text-gray-900">Hey there!</h1>
    <p class="text-gray-600 text-lg">Would you be willing to go on a date with me?</p>
    
    <div id="button-container" class="flex justify-center gap-4 pt-4">
      <button id="yesBtn" onclick="handleYes()" class="bg-pink-500 hover:bg-pink-600 text-white font-semibold px-6 py-3 rounded-xl shadow-lg hover:shadow-pink-500/30 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
        Yes! 💕
      </button>
      <button id="noBtn" onclick="handleNo()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-6 py-3 rounded-xl transition-all">
        No
      </button>
    </div>
  </div>

  <script>
    let noClickCount = 0;

    // Handle "No" button click with a friendly persistent nudge
    function handleNo() {
      noClickCount++;
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');

      if (noClickCount === 1) {
        Swal.fire({
          title: 'Are you sure?',
          text: 'Are you really sure you want to say no? 🥺',
          icon: 'question',
          confirmButtonText: 'Let me re-think...',
          confirmButtonColor: '#ec4899'
        });
        // Make the "Yes" button slightly bigger
        yesBtn.classList.add('scale-110');
      } else if (noClickCount === 2) {
        Swal.fire({
          title: 'Think again! 😉',
          text: 'It will be really fun, I promise!',
          icon: 'warning',
          confirmButtonText: 'Okay fine, let me think',
          confirmButtonColor: '#ec4899'
        });
        yesBtn.classList.remove('scale-110');
        yesBtn.classList.add('scale-125');
      } else {
        // Runaway / disable option or playful final popup
        Swal.fire({
          title: 'No non-sense allowed! 😜',
          text: 'The "No" button seems to be broken. You have to click Yes!',
          icon: 'error',
          confirmButtonText: 'Fine, YES!',
          confirmButtonColor: '#ec4899'
        }).then(() => {
          handleYes();
        });
      }
    }

    // Step 1: User clicks Yes -> Ask for Date
    async function handleYes() {
      // Get current date formatted for the min input constraint (YYYY-MM-DD)
      const today = new Date().toISOString().split('T')[0];

      const { value: selectedDate } = await Swal.fire({
        title: 'Awesome! 🎉',
        text: 'When are you available?',
        html: `<input type="date" id="swal-input-date" min="${today}" class="swal2-input">`,
        focusConfirm: false,
        confirmButtonText: 'Next ➡️',
        confirmButtonColor: '#ec4899',
        preConfirm: () => {
          const dateVal = document.getElementById('swal-input-date').value;
          if (!dateVal) {
            Swal.showValidationMessage('Please select a date!');
          }
          return dateVal;
        }
      });

      if (selectedDate) {
        askFoodPreference(selectedDate);
      }
    }

    // Step 2: Ask for Food Preference
    async function askFoodPreference(selectedDate) {
      const { value: foodPreference } = await Swal.fire({
        title: 'What food do you prefer?',
        input: 'select',
        inputOptions: {
          'Filipino': 'Filipino 🇵🇭',
          'Western': 'Western 🍔',
          'Chinese': 'Chinese 🥢',
          'Middle East': 'Middle Eastern 🥙',
          'Korean': 'Korean 🇰🇷'
        },
        inputPlaceholder: 'Select a cuisine',
        showCancelButton: false,
        confirmButtonText: 'Lock it in! ✨',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) {
            return 'Please pick a food preference!';
          }
        }
      });

      if (foodPreference) {
        showFinalConfirmation(selectedDate, foodPreference);
      }
    }

    // Step 3: Final confirmation message
    function showFinalConfirmation(date, food) {
      // Format the date nicely
      const formattedDate = new Date(date).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      Swal.fire({
        title: "It's a Date! ❤️",
        html: `
          <div class="text-left bg-pink-50 p-4 rounded-lg border border-pink-200 mt-2 space-y-2">
            <p>📅 <strong>Date:</strong> ${formattedDate}</p>
            <p>🍽️ <strong>Cuisine:</strong> ${food}</p>
          </div>
          <p class="mt-4 text-gray-600">Can't wait! I'll handle the rest. See you soon!</p>
        `,
        icon: 'success',
        confirmButtonText: 'Yay! 🥳',
        confirmButtonColor: '#ec4899'
      });
    }
  </script>
</body>
</html>
