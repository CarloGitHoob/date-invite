<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Invitation for You! 🐾✨</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- SweetAlert2 for interactive popups -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Canvas Confetti for celebratory visual effects -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #fff5f5 0%, #ffe3e8 50%, #fed7d7 100%);
      min-height: 100vh;
    }

    /* Floating animation for the Golden Retriever graphic */
    .dog-float {
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    /* Tulip bloom sway animation */
    .tulip-sway {
      animation: sway 3s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    @keyframes sway {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    /* SweetAlert custom styling overrides */
    .swal2-popup {
      border-radius: 1.5rem !important;
      padding: 1.75rem !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    .swal2-styled.swal2-confirm {
      border-radius: 1rem !important;
      font-weight: 600 !important;
      padding: 0.75rem 1.75rem !important;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen text-gray-800">

  <!-- Main Card Container -->
  <div class="bg-white/90 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl max-w-md w-full text-center space-y-6 border border-pink-100/80 relative overflow-hidden transition-all duration-300">
    
    <!-- Top Decorative Badge -->
    <div class="inline-flex items-center gap-1.5 bg-pink-50 border border-pink-200 text-pink-600 text-xs font-bold px-3.5 py-1.5 rounded-full uppercase tracking-wider shadow-sm">
      <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
      Special Invitation
    </div>

    <!-- Golden Retriever Illustration holding sign -->
    <div class="dog-float flex justify-center my-2">
      <div class="relative bg-amber-50/90 border-2 border-amber-200 p-4 rounded-3xl shadow-inner inline-block transform hover:scale-105 transition-transform duration-300">
        
        <!-- SVG Golden Retriever Graphic -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" class="w-36 h-36 sm:w-40 sm:h-40 mx-auto drop-shadow-sm">
          <!-- Body & Chest -->
          <path d="M70,120 Q70,90 90,80 L110,80 Q130,90 130,120 L130,160 L70,160 Z" fill="#E5A967"/>
          <path d="M85,110 Q100,125 115,110 L110,150 L90,150 Z" fill="#FFF2E2" opacity="0.6"/>
          
          <!-- Head Base -->
          <circle cx="100" cy="85" r="45" fill="#F4C085"/>
          
          <!-- Floppy Golden Ears -->
          <path d="M60,65 Q42,90 58,118 Q72,100 65,78 Z" fill="#D49353"/>
          <path d="M140,65 Q158,90 142,118 Q128,100 135,78 Z" fill="#D49353"/>
          
          <!-- Forehead Fur Accent -->
          <path d="M90,45 Q100,40 110,45 Q100,52 90,45 Z" fill="#E5A967" opacity="0.5"/>

          <!-- Snout / Muzzle -->
          <ellipse cx="100" cy="98" rx="20" ry="15" fill="#FCE8D0"/>
          <!-- Nose -->
          <path d="M92,90 Q100,88 108,90 Q104,100 96,100 Z" fill="#3E2723"/>
          <ellipse cx="97" cy="92" rx="2" ry="1" fill="#FFFFFF" opacity="0.6"/>

          <!-- Expressive Eyes -->
          <circle cx="83" cy="75" r="5" fill="#3E2723"/>
          <circle cx="117" cy="75" r="5" fill="#3E2723"/>
          <circle cx="81" cy="73" r="1.8" fill="#FFFFFF"/>
          <circle cx="115" cy="73" r="1.8" fill="#FFFFFF"/>
          
          <!-- Cute Eyebrows -->
          <path d="M78,66 Q83,63 88,66" stroke="#D49353" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M112,66 Q117,63 122,66" stroke="#D49353" stroke-width="2.5" stroke-linecap="round" fill="none"/>

          <!-- Happy Tongue -->
          <path d="M93,106 Q100,124 107,106 Z" fill="#FF6B81"/>
          
          <!-- Paws holding sign -->
          <ellipse cx="78" cy="150" rx="11" ry="13" fill="#F4C085"/>
          <ellipse cx="122" cy="150" rx="11" ry="13" fill="#F4C085"/>
          <circle cx="75" cy="146" r="2" fill="#E5A967"/>
          <circle cx="119" cy="146" r="2" fill="#E5A967"/>
        </svg>

        <!-- Animated Floating Heart Badge -->
        <div class="absolute -top-3 -right-2 bg-pink-500 text-white p-2 rounded-full shadow-lg animate-bounce text-xs">
          💖
        </div>
      </div>
    </div>

    <!-- Question Heading -->
    <div class="space-y-1.5">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">
        Would you be willing to go on a date with me?
      </h1>
      <p class="text-gray-500 text-sm">
        Our golden pup is holding the letter for you! 🐾
      </p>
    </div>
    
    <!-- Step 1 Action Buttons -->
    <div id="button-container" class="flex justify-center items-center gap-4 pt-2 min-h-[60px]">
      <button 
        id="yesBtn" 
        onclick="handleYes()" 
        class="bg-pink-500 hover:bg-pink-600 active:bg-pink-700 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-pink-500/25 hover:shadow-pink-500/40 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
        Yes! 💕
      </button>
      
      <button 
        id="noBtn" 
        onclick="handleNo()" 
        class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 font-semibold px-6 py-3.5 rounded-2xl transition-all duration-200">
        No
      </button>
    </div>

    <!-- Hidden Formspree Native Fallback Form -->
    <form id="formspree-fallback" action="https://formspree.io/f/xbldqjve" method="POST" class="hidden">
      <input type="text" name="recipient" value="carlo.lucido.coronado@gmail.com">
      <input type="text" name="willing" id="form-willing">
      <input type="text" name="date" id="form-date">
      <input type="text" name="food" id="form-food">
      <input type="text" name="activity" id="form-activity">
    </form>
  </div>

  <script>
    // Global State for Collected Choices
    let noClickCount = 0;
    const formData = {
      willing: '',
      date: '',
      food: '',
      activity: ''
    };

    // Target Recipient Email
    const RECIPIENT_EMAIL = "carlo.lucido.coronado@gmail.com";

    // Initialize EmailJS (Optional: Replace with your Public Key if available)
    (function(){
      if (window.emailjs) {
        emailjs.init("YOUR_PUBLIC_KEY"); // Replace with EmailJS Public Key if configured
      }
    })();

    /* -------------------------------------------------------------
     * STEP 1: Playful "No" Handler with expanding "Yes" button
     * ------------------------------------------------------------- */
    function handleNo() {
      noClickCount++;
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');

      if (noClickCount === 1) {
        Swal.fire({
          title: 'Are you sure? 🥺',
          text: 'The golden retriever looks a little sad now...',
          icon: 'question',
          confirmButtonText: 'Let me rethink!',
          confirmButtonColor: '#ec4899'
        });
        yesBtn.classList.add('scale-125', 'z-10');
        noBtn.classList.add('scale-90', 'opacity-80');
      } else if (noClickCount === 2) {
        Swal.fire({
          title: 'Pretty please? 🐶',
          text: 'Think about all the delicious food and fun activities!',
          icon: 'warning',
          confirmButtonText: 'Okay fine, YES! 💕',
          confirmButtonColor: '#ec4899'
        }).then(() => {
          handleYes();
        });
      } else {
        // Force conversion to Yes
        handleYes();
      }
    }

    /* -------------------------------------------------------------
     * STEP 2: Date Picker Modal (Restricted up to Dec 20, 2026)
     * ------------------------------------------------------------- */
    async function handleYes() {
      formData.willing = 'Yes';
      
      // Upper date limit strictly set to Dec 20, 2026
      const maxDate = '2026-12-20';
      const today = new Date().toISOString().split('T')[0];
      const minDate = today < '2026-01-01' ? '2026-01-01' : today;
      const initialValue = minDate <= maxDate ? minDate : maxDate;

      const { value: selectedDate } = await Swal.fire({
        title: 'Yay! 🎉',
        text: 'When are you available? (Up to Dec 20, 2026)',
        html: `
          <div class="mt-3">
            <input 
              type="date" 
              id="swal-input-date" 
              min="${minDate}" 
              max="${maxDate}" 
              value="${initialValue}" 
              class="w-full px-4 py-3 border border-pink-200 rounded-xl focus:ring-2 focus:ring-pink-500 focus:outline-none text-gray-700 font-medium">
          </div>
        `,
        focusConfirm: false,
        confirmButtonText: 'Next: Food ➡️',
        confirmButtonColor: '#ec4899',
        showCancelButton: false,
        preConfirm: () => {
          const dateVal = document.getElementById('swal-input-date').value;
          if (!dateVal) {
            Swal.showValidationMessage('Please select a date!');
            return false;
          }
          if (dateVal > maxDate) {
            Swal.showValidationMessage('Please select a date on or before December 20, 2026!');
            return false;
          }
          return dateVal;
        }
      });

      if (selectedDate) {
        formData.date = selectedDate;
        askFoodPreference();
      }
    }

    /* -------------------------------------------------------------
     * STEP 3: Food Preference Select Modal
     * ------------------------------------------------------------- */
    async function askFoodPreference() {
      const { value: foodPreference } = await Swal.fire({
        title: 'What cuisine do you prefer? 🍽️',
        input: 'select',
        inputOptions: {
          'Chinese': 'Chinese 🥢',
          'Filipino': 'Filipino 🇵🇭',
          'Korean': 'Korean 🇰🇷',
          'Japanese': 'Japanese 🍣',
          'Indian': 'Indian 🍛',
          'American': 'American 🍔',
          'Others': 'Others (Please specify)'
        },
        inputPlaceholder: 'Select food preference',
        confirmButtonText: 'Next: Activity ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) return 'Please select a food preference!';
        }
      });

      if (foodPreference === 'Others') {
        askOtherFood();
      } else if (foodPreference) {
        formData.food = foodPreference;
        askPreferredActivity();
      }
    }

    /* Custom Text Input Prompt for "Others" Food Option */
    async function askOtherFood() {
      const { value: customFood } = await Swal.fire({
        title: 'Specify your cuisine preference: 🍜',
        input: 'text',
        inputPlaceholder: 'e.g., Italian pasta, Mexican tacos...',
        confirmButtonText: 'Next ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value || !value.trim()) {
            return 'Please type your preferred food!';
          }
        }
      });

      if (customFood) {
        formData.food = `Others: ${customFood.trim()}`;
        askPreferredActivity();
      }
    }

    /* -------------------------------------------------------------
     * STEP 4: Preferred Activity Selection
     * ------------------------------------------------------------- */
    async function askPreferredActivity() {
      const { value: activity } = await Swal.fire({
        title: 'What vibe or activity do you prefer? ✨',
        input: 'select',
        inputOptions: {
          'Artsy': '🎨 Artsy (Museums, Painting, Galleries)',
          'Active': '⚡ Active (Bowling, Arcade, Walking tour)',
          'Calm': '☕ Calm (Coffee shop, Quiet dinner, Strolling)'
        },
        inputPlaceholder: 'Select an activity',
        confirmButtonText: 'See Summary 💕',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) return 'Please select an activity vibe!';
        }
      });

      if (activity) {
        formData.activity = activity;
        showSummaryAndSubmit();
      }
    }

    /* -------------------------------------------------------------
     * STEP 5: Summary Modal, Confetti & Automated Background Email
     * ------------------------------------------------------------- */
    async function showSummaryAndSubmit() {
      // Trigger festive confetti cannons
      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });

      const formattedDate = new Date(formData.date).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      // Render Final Summary Modal with Bouquet of Tulips
      Swal.fire({
        title: "It's a Date! 🌷✨",
        html: `
          <div class="text-center space-y-4">
            
            <!-- Animated Tulip Bouquet Illustration -->
            <div class="tulip-sway flex justify-center my-2">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" class="w-44 h-36 drop-shadow-md">
                <!-- Stems -->
                <path d="M100,130 Q90,95 75,45" stroke="#4CAF50" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                <path d="M100,130 Q105,90 115,38" stroke="#4CAF50" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                <path d="M100,130 Q80,100 55,55" stroke="#4CAF50" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path d="M100,130 Q120,100 145,55" stroke="#4CAF50" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path d="M100,130 Q100,80 95,30" stroke="#4CAF50" stroke-width="4.5" stroke-linecap="round" fill="none"/>

                <!-- Leaves -->
                <path d="M80,110 Q55,90 65,130 Q90,120 80,110 Z" fill="#66BB6A"/>
                <path d="M120,110 Q145,90 135,130 Q110,120 120,110 Z" fill="#66BB6A"/>

                <!-- Tulip Blooms -->
                <!-- Left Outer Tulip -->
                <path d="M45,50 C40,35 50,25 55,40 C60,25 70,35 65,50 C70,60 50,60 45,50 Z" fill="#FF6B81"/>
                
                <!-- Center Left Tulip -->
                <path d="M70,38 C65,22 80,18 78,38 C83,22 93,30 88,48 C78,58 68,48 70,38 Z" fill="#FF477E"/>
                
                <!-- Center Main Tulip -->
                <path d="M88,25 C83,10 102,5 100,25 C105,8 117,18 112,35 C102,48 88,38 88,25 Z" fill="#E91E63"/>

                <!-- Center Right Tulip -->
                <path d="M110,32 C110,18 128,20 122,38 C128,25 138,32 132,48 C122,58 108,45 110,32 Z" fill="#FF6B81"/>

                <!-- Right Outer Tulip -->
                <path d="M135,48 C145,33 155,42 150,58 C155,68 135,68 135,48 Z" fill="#FF8E9E"/>

                <!-- Bouquet Ribbon & Wrap -->
                <path d="M82,110 L118,110 L128,155 L72,155 Z" fill="#FCE4EC" stroke="#F48FB1" stroke-width="2"/>
                <path d="M82,110 Q100,118 118,110 L122,125 Q100,132 78,125 Z" fill="#F8BBD0"/>
                <!-- Bow -->
                <ellipse cx="100" cy="122" rx="10" ry="7" fill="#E91E63"/>
                <path d="M92,122 Q80,130 85,142 Q95,135 96,125 Z" fill="#E91E63"/>
                <path d="M108,122 Q120,130 115,142 Q105,135 104,125 Z" fill="#E91E63"/>
              </svg>
            </div>

            <!-- Choices Table -->
            <div class="text-left bg-pink-50/80 p-4 rounded-2xl border border-pink-200/80 space-y-2 text-sm text-gray-800 shadow-sm">
              <p class="flex items-center gap-2">
                <span>📅</span> <strong>Date:</strong> ${formattedDate}
              </p>
              <p class="flex items-center gap-2">
                <span>🍽️</span> <strong>Food:</strong> ${formData.food}
              </p>
              <p class="flex items-center gap-2">
                <span>🎨</span> <strong>Activity:</strong> ${formData.activity}
              </p>
            </div>
            
            <p id="sending-status" class="text-xs text-gray-500 animate-pulse">
              Sending your choices to Carlo... 💌
            </p>
          </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false
      });

      // Submit results automatically via background APIs
      await sendDataToBackend();
    }

    /* -------------------------------------------------------------
     * AUTOMATED BACKEND SUBMISSION SYSTEM
     * Sends email without opening user's mail client app
     * ------------------------------------------------------------- */
    async function sendDataToBackend() {
      const payload = {
        recipient: RECIPIENT_EMAIL,
        willing: formData.willing,
        date: formData.date,
        food: formData.food,
        activity: formData.activity,
        message: `Date Invitation Accepted! 💕\n\nWilling: ${formData.willing}\nDate: ${formData.date}\nFood Preference: ${formData.food}\nPreferred Activity: ${formData.activity}`
      };

      let sentSuccessfully = false;

      // Method A: Submit via Formspree AJAX Endpoint
      try {
        const response = await fetch("https://formspree.io/f/xbldqjve", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          sentSuccessfully = true;
        }
      } catch (err) {
        console.log("Formspree fetch failed, trying fallback...", err);
      }

      // Method B: Try EmailJS SDK as alternate API background delivery
      if (!sentSuccessfully && window.emailjs) {
        try {
          await emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
            to_email: RECIPIENT_EMAIL,
            willing: formData.willing,
            date: formData.date,
            food: formData.food,
            activity: formData.activity
          });
          sentSuccessfully = true;
        } catch (err) {
          console.log("EmailJS delivery failed", err);
        }
      }

      // Final UI Update upon successful transmission
      const statusElement = document.getElementById('sending-status');
      if (statusElement) {
        statusElement.classList.remove('animate-pulse');
        statusElement.innerHTML = "✨ Response sent automatically to Carlo! See you on the date!";
        statusElement.classList.add('text-pink-600', 'font-semibold');
      }

      // Show final closing button
      setTimeout(() => {
        Swal.update({
          showConfirmButton: true,
          confirmButtonText: 'Can\'t Wait! 💕',
          confirmButtonColor: '#ec4899'
        });
      }, 1000);
    }
  </script>
</body>
</html>
