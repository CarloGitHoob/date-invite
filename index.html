<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Very Special Date Invitation! 🐾🌷</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap');

    body {
      background: linear-gradient(-45deg, #fff1f2, #ffe4e6, #fecdd3, #fda4af, #fff1f2);
      background-size: 400% 400%;
      animation: gradientBG 14s ease infinite;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    .font-heading {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Card Glow Animation */
    .card-glow {
      box-shadow: 0 20px 50px -10px rgba(244, 114, 182, 0.3),
                  0 0 30px 5px rgba(251, 207, 232, 0.5);
    }

    /* Golden Retriever 2D Animations */
    .dog-head-pivot {
      transform-origin: 100px 105px;
      transition: transform 0.1s ease-out;
    }

    .dog-tail {
      transform-origin: 155px 125px;
      animation: wagTail 0.6s ease-in-out infinite alternate;
    }

    @keyframes wagTail {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(18deg); }
    }

    .dog-ear-left {
      transform-origin: 62px 65px;
      animation: wiggleEar 3s ease-in-out infinite;
    }

    .dog-ear-right {
      transform-origin: 138px 65px;
      animation: wiggleEar 3s ease-in-out 0.4s infinite;
    }

    @keyframes wiggleEar {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-8deg); }
      96% { transform: rotate(5deg); }
    }

    .dog-eye {
      animation: blinkEye 4s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes blinkEye {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }

    .dog-tongue {
      animation: pantTongue 0.8s ease-in-out infinite alternate;
      transform-origin: 100px 105px;
    }

    @keyframes pantTongue {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(2px) scale(1.05); }
    }

    .floating-badge {
      animation: floatBadge 2.5s ease-in-out infinite alternate;
    }

    @keyframes floatBadge {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-8px) rotate(3deg); }
    }

    /* Floating Heart Effect */
    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.8s ease-out forwards;
      font-size: 1.5rem;
      z-index: 100;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
      50% { opacity: 0.9; transform: translateY(-50px) scale(1.3) rotate(15deg); }
      100% { opacity: 0; transform: translateY(-110px) scale(1.6) rotate(-15deg); }
    }

    /* Fleeing No button styling */
    #noBtn {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 50;
    }

    /* Puppy Speech Bubble */
    .speech-bubble {
      position: absolute;
      top: -35px;
      right: -20px;
      background: #ffffff;
      color: #db2777;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(219, 39, 119, 0.15);
      border: 1.5px solid #fbcfe8;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.25s ease;
      white-space: nowrap;
      z-index: 30;
    }

    .speech-bubble.active {
      opacity: 1;
      transform: scale(1) translateY(-6px);
    }

    /* Tulip Bloom Interactive Component */
    .tulip-garden-container {
      cursor: pointer;
      position: relative;
      padding: 10px;
      border-radius: 20px;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4e8 100%);
      border: 2px dashed #f472b6;
      transition: all 0.3s ease;
    }

    .tulip-garden-container:hover {
      background: linear-gradient(135deg, #ffe4e8 0%, #fcd34d 100%);
      border-color: #ec4899;
      transform: scale(1.02);
    }

    /* Tulip blooming transition states */
    .tulip-petal-left {
      transform-origin: 30% 80%;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tulip-petal-right {
      transform-origin: 70% 80%;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tulip-petal-center {
      transform-origin: 50% 90%;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tulip-stem {
      transform-origin: bottom center;
      transition: transform 0.6s ease;
    }

    /* Bloomed state CSS transforms */
    .bloomed .tulip-1 .tulip-petal-left { transform: rotate(-28deg) scale(1.15) translateX(-3px); }
    .bloomed .tulip-1 .tulip-petal-right { transform: rotate(28deg) scale(1.15) translateX(3px); }
    .bloomed .tulip-1 .tulip-petal-center { transform: scaleY(1.25) translateY(-2px); }

    .bloomed .tulip-2 .tulip-petal-left { transform: rotate(-32deg) scale(1.2) translateX(-4px); }
    .bloomed .tulip-2 .tulip-petal-right { transform: rotate(32deg) scale(1.2) translateX(4px); }
    .bloomed .tulip-2 .tulip-petal-center { transform: scaleY(1.3) translateY(-4px); }

    .bloomed .tulip-3 .tulip-petal-left { transform: rotate(-26deg) scale(1.1) translateX(-3px); }
    .bloomed .tulip-3 .tulip-petal-right { transform: rotate(26deg) scale(1.1) translateX(3px); }
    .bloomed .tulip-3 .tulip-petal-center { transform: scaleY(1.2) translateY(-2px); }

    .bloomed .tulip-stem { animation: swayStem 2.5s ease-in-out infinite alternate; }

    @keyframes swayStem {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    .sparkle-burst {
      position: absolute;
      pointer-events: none;
      font-size: 1.2rem;
      animation: burstAnim 0.8s ease-out forwards;
    }

    @keyframes burstAnim {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(180deg); }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 relative min-h-screen" onclick="createHeartParticle(event)">

  <!-- Main Glassmorphic Interactive Card -->
  <div id="card" class="bg-white/85 backdrop-blur-xl p-8 rounded-[2.5rem] card-glow max-w-md w-full text-center space-y-6 border border-white/60 relative z-10 transition-all duration-500 transform hover:shadow-pink-300/50">
    
    <!-- Top Floating Tag -->
    <div class="flex justify-between items-center px-2">
      <span class="bg-pink-100/80 text-pink-600 text-xs font-bold px-3.5 py-1.5 rounded-full uppercase tracking-wider flex items-center gap-1.5 border border-pink-200">
        <i class="fa-solid fa-heart text-pink-500 animate-pulse"></i> Invitation For You
      </span>
      <span class="text-xs font-semibold text-amber-700 bg-amber-100/80 px-3 py-1 rounded-full border border-amber-200 floating-badge">
        🐾 Buddy approved!
      </span>
    </div>

    <!-- Interactive 2D Golden Retriever Vector -->
    <div class="flex justify-center relative my-2">
      <div id="dogCardContainer" class="relative bg-gradient-to-b from-amber-50 to-orange-100/60 border-2 border-amber-200/80 p-4 rounded-3xl shadow-inner inline-block transition-transform duration-300 hover:scale-105">
        
        <!-- Speech Bubble for Puppy -->
        <div id="speechBubble" class="speech-bubble">Woof! Say yes please! 🦴</div>

        <svg id="dogSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" class="w-40 h-40 mx-auto drop-shadow-md">
          <defs>
            <!-- Dog Fur Gradient -->
            <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#F7C882" />
              <stop offset="100%" stop-color="#E5A358" />
            </linearGradient>
            <linearGradient id="furLight" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFDF9E" />
              <stop offset="100%" stop-color="#F7C882" />
            </linearGradient>
            <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#D98A3C" />
              <stop offset="100%" stop-color="#B86E28" />
            </linearGradient>
            <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF477E" />
              <stop offset="100%" stop-color="#FF70A6" />
            </linearGradient>
          </defs>

          <!-- Animated Tail -->
          <path class="dog-tail" d="M150,130 Q180,120 175,95 C170,80 155,90 150,110 Z" fill="url(#furGrad)" stroke="#C77D28" stroke-width="1.5"/>

          <!-- Dog Body -->
          <path d="M65,120 Q60,95 85,85 L115,85 Q140,95 135,120 L138,155 Q138,162 125,162 L75,162 Q62,162 65,120 Z" fill="url(#furGrad)" stroke="#C77D28" stroke-width="1.5"/>
          <path d="M82,100 Q100,108 118,100 L122,158 Q100,165 78,158 Z" fill="url(#furLight)"/>

          <!-- Cute Collar with Golden Bell/Tag -->
          <path d="M72,112 Q100,122 128,112 L126,119 Q100,129 74,119 Z" fill="url(#collarGrad)"/>
          <circle cx="100" cy="123" r="5.5" fill="#FFD700" stroke="#B8860B" stroke-width="1"/>
          <circle cx="100" cy="123" r="2" fill="#FFF"/>

          <!-- Front Paws -->
          <ellipse cx="80" cy="158" rx="11" ry="7" fill="url(#furLight)" stroke="#C77D28" stroke-width="1.5"/>
          <ellipse cx="120" cy="158" rx="11" ry="7" fill="url(#furLight)" stroke="#C77D28" stroke-width="1.5"/>
          <!-- Paw details -->
          <path d="M76,158 L76,162 M80,159 L80,163 M84,158 L84,162" stroke="#A8621A" stroke-width="1" stroke-linecap="round"/>
          <path d="M116,158 L116,162 M120,159 L120,163 M124,158 L124,162" stroke="#A8621A" stroke-width="1" stroke-linecap="round"/>

          <!-- HEAD GROUP (Tracks Mouse Cursor) -->
          <g id="dogHeadGroup" class="dog-head-pivot">
            <!-- Flappy Ears -->
            <path class="dog-ear-left" d="M62,65 Q35,80 45,112 Q65,120 68,85 Z" fill="url(#earGrad)" stroke="#A8621A" stroke-width="1.5"/>
            <path class="dog-ear-right" d="M138,65 Q165,80 155,112 Q135,120 132,85 Z" fill="url(#earGrad)" stroke="#A8621A" stroke-width="1.5"/>

            <!-- Main Head Shape -->
            <circle cx="100" cy="75" r="42" fill="url(#furGrad)" stroke="#C77D28" stroke-width="1.5"/>
            <path d="M70,60 Q100,42 130,60 Q100,52 70,60 Z" fill="url(#furLight)"/>

            <!-- Fluffy Snout & Muzzle -->
            <ellipse cx="100" cy="88" rx="21" ry="15" fill="#FFF5E4" stroke="#D9A86C" stroke-width="1"/>
            
            <!-- Cute Nose with Highlight -->
            <path d="M92,80 Q100,77 108,80 Q108,89 100,93 Q92,89 92,80 Z" fill="#2C1810"/>
            <ellipse cx="97" cy="82" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.8"/>

            <!-- Mouth & Panting Tongue -->
            <path d="M92,93 Q100,98 108,93" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path class="dog-tongue" d="M95,96 Q100,114 105,96 Z" fill="#FF5277" stroke="#D83359" stroke-width="1"/>

            <!-- Expressive Eyes -->
            <g class="dog-eye">
              <circle cx="80" cy="70" r="5.5" fill="#2C1810"/>
              <circle cx="78.5" cy="68" r="2" fill="#FFFFFF"/>
            </g>
            <g class="dog-eye">
              <circle cx="120" cy="70" r="5.5" fill="#2C1810"/>
              <circle cx="118.5" cy="68" r="2" fill="#FFFFFF"/>
            </g>

            <!-- Cute Eyebrows -->
            <path d="M74,61 Q80,57 86,62" stroke="#B86E28" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M114,62 Q120,57 126,61" stroke="#B86E28" stroke-width="2.5" fill="none" stroke-linecap="round"/>

            <!-- Blush Spots -->
            <ellipse cx="70" cy="78" rx="5" ry="3" fill="#FF8A8A" opacity="0.4"/>
            <ellipse cx="130" cy="78" rx="5" ry="3" fill="#FF8A8A" opacity="0.4"/>
          </g>
        </svg>

        <div class="absolute -top-2 -right-1 text-2xl animate-bounce">💌</div>
      </div>
    </div>

    <!-- Main Title & Prompt -->
    <div>
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight font-heading leading-snug">
        Will you go on a date with me?
      </h1>
      <p class="text-gray-500 text-sm mt-2 font-medium">
        Our golden puppy Buddy won't stop wagging his tail until you say yes! 🐾✨
      </p>
    </div>
    
    <!-- Dynamic Interactive Button Container -->
    <div id="button-container" class="flex justify-center items-center gap-4 pt-2 relative min-h-[70px]">
      <button id="yesBtn" onclick="handleYes()" class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-pink-500/30 hover:shadow-pink-500/50 transition-all transform hover:scale-105 active:scale-95 z-20 flex items-center gap-2">
        <span>Yes!</span> <i class="fa-solid fa-heart text-white text-sm"></i>
      </button>
      
      <!-- Fleeing No Button -->
      <button id="noBtn" onmouseover="dodgeNoBtn(event)" ontouchstart="dodgeNoBtn(event)" onclick="dodgeNoBtn(event)" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold px-6 py-3.5 rounded-2xl shadow-sm border border-gray-200 z-20">
        No
      </button>
    </div>
  </div>

  <!-- Hidden Formspree Submission Form -->
  <form id="hidden-form" style="display:none;">
    <input type="hidden" name="Willing" id="form-willing">
    <input type="hidden" name="Preferred Date & Time" id="form-date">
    <input type="hidden" name="Food Preference" id="form-food">
    <input type="hidden" name="Preferred Activity" id="form-activity">
    <input type="hidden" name="What to Wear" id="form-wear">
  </form>

  <script>
    let formData = {};
    const FORMSPREE_ID = 'mdeekqpl';
    let noDodgeCount = 0;

    // Dog SVG Data URI for SweetAlert Popups
    const dogSvgUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100" height="100">
        <circle cx="100" cy="75" r="42" fill="#F7C882" stroke="#C77D28" stroke-width="1.5"/>
        <path d="M62,65 Q35,80 45,112 Q65,120 68,85 Z" fill="#D98A3C"/>
        <path d="M138,65 Q165,80 155,112 Q135,120 132,85 Z" fill="#D98A3C"/>
        <ellipse cx="100" cy="88" rx="21" ry="15" fill="#FFF5E4"/>
        <path d="M92,80 Q100,77 108,80 Q108,89 100,93 Q92,89 92,80 Z" fill="#2C1810"/>
        <circle cx="80" cy="70" r="5.5" fill="#2C1810"/>
        <circle cx="78.5" cy="68" r="2" fill="#FFFFFF"/>
        <circle cx="120" cy="70" r="5.5" fill="#2C1810"/>
        <circle cx="118.5" cy="68" r="2" fill="#FFFFFF"/>
        <path d="M95,96 Q100,114 105,96 Z" fill="#FF5277"/>
      </svg>
    `);

    // Puppy sound synthesizer using Web Audio API
    function playAudioTone(freq, type = 'sine', duration = 0.15) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Dynamic Head Movement Following Mouse Cursor
    document.addEventListener('mousemove', (e) => {
      const dogHead = document.getElementById('dogHeadGroup');
      if (!dogHead) return;

      const rect = dogHead.getBoundingClientRect();
      const headX = rect.left + rect.width / 2;
      const headY = rect.top + rect.height / 2;

      const angle = Math.atan2(e.clientY - headY, e.clientX - headX) * (180 / Math.PI);
      const clampedAngle = Math.max(-15, Math.min(15, angle / 6));

      dogHead.style.transform = `rotate(${clampedAngle}deg)`;
    });

    // Touch support for Head Tracking
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        const dogHead = document.getElementById('dogHeadGroup');
        if (!dogHead) return;

        const rect = dogHead.getBoundingClientRect();
        const headX = rect.left + rect.width / 2;
        const headY = rect.top + rect.height / 2;

        const angle = Math.atan2(touch.clientY - headY, touch.clientX - headX) * (180 / Math.PI);
        const clampedAngle = Math.max(-15, Math.min(15, angle / 6));

        dogHead.style.transform = `rotate(${clampedAngle}deg)`;
      }
    });

    // Tap Screen Particle Animation
    function createHeartParticle(event) {
      if (event.target.closest('button') || event.target.closest('.swal2-container')) return;
      
      const hearts = ['💖', '💕', '🌸', '✨', '🐾', '🌷', '💘'];
      const particle = document.createElement('div');
      particle.className = 'heart-particle';
      particle.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      particle.style.left = `${event.clientX - 10}px`;
      particle.style.top = `${event.clientY - 10}px`;
      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 1800);
    }

    // Dodging 'No' button with dog bark messages
    const puppyBarkQuotes = [
      "Hey! Wrong button! 🐾",
      "Ruff! Try clicking Yes! 💕",
      "No isn't an option! 🐶",
      "Buddy says: Please? 🥺",
      "Woof! Too fast for ya! ⚡",
      "Nice try! Pink button next! 💖"
    ];

    function dodgeNoBtn(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      playAudioTone(320, 'triangle', 0.1);
      
      noDodgeCount++;
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      const speechBubble = document.getElementById('speechBubble');

      // Expand Yes Button dynamically
      if (noDodgeCount <= 6) {
        const currentScale = 1 + (noDodgeCount * 0.08);
        yesBtn.style.transform = `scale(${currentScale})`;
      }

      // Show Speech Bubble Quote
      speechBubble.innerText = puppyBarkQuotes[Math.floor(Math.random() * puppyBarkQuotes.length)];
      speechBubble.classList.add('active');
      setTimeout(() => speechBubble.classList.remove('active'), 2000);

      noBtn.style.position = 'fixed';
      
      const padding = 30;
      const btnWidth = noBtn.offsetWidth || 80;
      const btnHeight = noBtn.offsetHeight || 40;
      
      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;
      
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
      
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // Step 1: Handle "Yes!" Click
    async function handleYes() {
      playAudioTone(587.33, 'sine', 0.25);
      formData.willing = 'Yes';
      const maxDate = '2026-12-20';
      const today = new Date().toISOString().split('T')[0];
      const minDate = today < '2026-01-01' ? '2026-01-01' : today;

      const { value: formValues } = await Swal.fire({
        title: 'Yay! It\'s a Date! 🎉',
        text: 'When and what time are you available?',
        imageUrl: dogSvgUrl,
        imageWidth: 90,
        imageHeight: 90,
        imageAlt: 'Golden Retriever',
        customClass: {
          popup: 'rounded-3xl border-2 border-pink-200',
          confirmButton: 'rounded-2xl px-6 py-3 font-bold bg-pink-500 hover:bg-pink-600'
        },
        html: `
          <div style="text-align: left;" class="space-y-3 mt-2">
            <div>
              <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Select Date (Until Dec 20, 2026):</label>
              <input type="date" id="swal-input-date" min="${minDate}" max="${maxDate}" class="swal2-input !w-full !m-0 !mt-1 !rounded-xl !border-gray-200" value="${minDate <= maxDate ? minDate : maxDate}">
            </div>
            <div>
              <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Select Time:</label>
              <input type="time" id="swal-input-time" class="swal2-input !w-full !m-0 !mt-1 !rounded-xl !border-gray-200" value="18:00">
            </div>
          </div>
        `,
        focusConfirm: false,
        confirmButtonText: 'Next Step ➡️',
        confirmButtonColor: '#ec4899',
        preConfirm: () => {
          const dateVal = document.getElementById('swal-input-date').value;
          const timeVal = document.getElementById('swal-input-time').value;
          if (!dateVal) {
            Swal.showValidationMessage('Please select a date!');
          } else if (dateVal > maxDate) {
            Swal.showValidationMessage('Please pick a date on or before December 20, 2026!');
          } else if (!timeVal) {
            Swal.showValidationMessage('Please select a time!');
          }
          return { date: dateVal, time: timeVal };
        }
      });

      if (formValues) {
        formData.date = formValues.date;
        formData.time = formValues.time;
        askFoodPreference();
      }
    }

    // Step 2: Food Preference
    async function askFoodPreference() {
      playAudioTone(659.25, 'sine', 0.25);
      const { value: foodPreference } = await Swal.fire({
        title: 'What food are you craving? 🍽️',
        imageUrl: dogSvgUrl,
        imageWidth: 90,
        imageHeight: 90,
        customClass: {
          popup: 'rounded-3xl border-2 border-pink-200',
          confirmButton: 'rounded-2xl px-6 py-3 font-bold'
        },
        input: 'select',
        inputOptions: {
          'Chinese': 'Chinese 🥢',
          'Filipino': 'Filipino 🇵🇭',
          'Korean': 'Korean 🇰🇷',
          'Japanese': 'Japanese 🍣',
          'Indian': 'Indian 🍛',
          'American': 'American 🍔',
          'Others': 'Others (Specify custom cuisine)'
        },
        inputPlaceholder: 'Select cuisine type',
        confirmButtonText: 'Next Step ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) return 'Please pick your food preference!';
        }
      });

      if (foodPreference === 'Others') {
        askOtherFood();
      } else if (foodPreference) {
        formData.food = foodPreference;
        askPreferredActivity();
      }
    }

    // Step 2b: Custom Food
    async function askOtherFood() {
      playAudioTone(659.25, 'sine', 0.25);
      const { value: customFood } = await Swal.fire({
        title: 'Specify your cuisine choice 🍕 Spaghetti, Tacos...?',
        imageUrl: dogSvgUrl,
        imageWidth: 90,
        imageHeight: 90,
        input: 'text',
        inputPlaceholder: 'e.g., Italian, Thai, Mediterranean...',
        showCancelButton: true,
        cancelButtonText: '⬅️ Back',
        confirmButtonText: 'Save & Next ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value || !value.trim()) {
            return 'Please type your preferred food!';
          }
        }
      });

      if (customFood) {
        formData.food = `Others: ${customFood.trim()}`;
        askPreferredActivity();
      } else {
        askFoodPreference();
      }
    }

    // Step 3: Activity Vibe
    async function askPreferredActivity() {
      playAudioTone(783.99, 'sine', 0.25);
      const { value: activity } = await Swal.fire({
        title: 'What activity vibe do you like? ✨',
        imageUrl: dogSvgUrl,
        imageWidth: 90,
        imageHeight: 90,
        input: 'select',
        inputOptions: {
          'Artsy': '🎨 Artsy (Museums, Painting, Art galleries)',
          'Active': '⚡ Active (Bowling, Arcade, City Stroll)',
          'Calm': '☕ Calm (Coffee date, Quiet dinner, Parks)'
        },
        inputPlaceholder: 'Select an activity vibe',
        confirmButtonText: 'Next Step ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) return 'Please select an activity vibe!';
        }
      });

      if (activity) {
        formData.activity = activity;
        askWhatToWear();
      }
    }

    // Step 4: What to wear
    async function askWhatToWear() {
      playAudioTone(830.61, 'sine', 0.25);
      formData.wear = 'Kung saan ka comfortable';

      await Swal.fire({
        title: 'Dress Code Rule 👗✨',
        imageUrl: dogSvgUrl,
        imageWidth: 90,
        imageHeight: 90,
        html: `
          <div class="space-y-3 text-center my-2">
            <p class="text-sm text-gray-500 font-medium">No pressure rule for the date:</p>
            <div class="bg-gradient-to-r from-pink-50 to-rose-50 border-2 border-pink-200 p-4 rounded-2xl font-bold text-pink-600 text-lg shadow-inner">
              Kung saan ka comfortable 💖✨
            </div>
          </div>
        `,
        confirmButtonText: 'See Invitation Summary 💕',
        confirmButtonColor: '#ec4899',
        allowOutsideClick: false
      });

      showSummaryAndTulips();
    }

    // Interactive Tulip Blooming Effect Function
    function bloomTulips() {
      const container = document.getElementById('tulipGarden');
      if (!container) return;

      container.classList.add('bloomed');

      // Play joyful chord progression
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        setTimeout(() => playAudioTone(freq, 'sine', 0.25), idx * 100);
      });

      // Confetti burst
      confetti({
        particleCount: 45,
        spread: 60,
        origin: { y: 0.65 }
      });

      // Sparkle particles burst animation
      const rect = container.getBoundingClientRect();
      const sparkles = ['🌸', '✨', '🌺', '🌷', '💖', '💫'];

      for (let i = 0; i < 12; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle-burst';
        sparkle.innerText = sparkles[Math.floor(Math.random() * sparkles.length)];

        const tx = (Math.random() - 0.5) * 160;
        const ty = -Math.random() * 100 - 30;

        sparkle.style.setProperty('--tx', `${tx}px`);
        sparkle.style.setProperty('--ty', `${ty}px`);
        sparkle.style.left = `${rect.width / 2 + (Math.random() * 40 - 20)}px`;
        sparkle.style.top = `${rect.height / 2}px`;

        container.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 800);
      }
    }

    // Step 5: Final Summary Screen with Interactive Blooming 2D Tulips
    function showSummaryAndTulips() {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        setTimeout(() => playAudioTone(freq, 'triangle', 0.3), idx * 150);
      });

      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });

      const formattedDate = new Date(formData.date).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      // Format time to 12-hour AM/PM format
      const [hours, minutes] = formData.time.split(':');
      const hourNum = parseInt(hours, 10);
      const ampm = hourNum >= 12 ? 'PM' : 'AM';
      const formattedHour = hourNum % 12 || 12;
      const formattedTime = `${formattedHour}:${minutes} ${ampm}`;

      const dateTimeString = `${formattedDate} at ${formattedTime}`;

      Swal.fire({
        title: "It's Official! 🌷✨",
        imageUrl: dogSvgUrl,
        imageWidth: 80,
        imageHeight: 80,
        html: `
          <div class="text-center space-y-4">
            
            <!-- Interactive Blooming 2D Tulip Garden Component -->
            <div id="tulipGarden" class="tulip-garden-container my-2" onclick="bloomTulips()">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" class="w-full h-36 mx-auto drop-shadow-md">
                <defs>
                  <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#4CAF50"/>
                    <stop offset="100%" stop-color="#2E7D32"/>
                  </linearGradient>
                  <linearGradient id="tulipRed" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FF477E"/>
                    <stop offset="100%" stop-color="#E91E63"/>
                  </linearGradient>
                  <linearGradient id="tulipPink" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FF8E9E"/>
                    <stop offset="100%" stop-color="#FF5277"/>
                  </linearGradient>
                  <linearGradient id="tulipYellow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FFD54F"/>
                    <stop offset="100%" stop-color="#FFB300"/>
                  </linearGradient>
                  <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#FFF0F5"/>
                    <stop offset="100%" stop-color="#FCE4EC"/>
                  </linearGradient>
                </defs>

                <!-- Flower Pot Base -->
                <path d="M85,115 L155,115 L145,155 L95,155 Z" fill="url(#potGrad)" stroke="#F48FB1" stroke-width="2"/>
                <rect x="80" y="108" width="80" height="10" rx="4" fill="#F8BBD0" stroke="#F48FB1" stroke-width="1.5"/>
                <!-- Ribbon Ribbon Bow -->
                <path d="M120,132 Q110,122 100,132 Q110,140 120,132 Z" fill="#E91E63"/>
                <path d="M120,132 Q130,122 140,132 Q130,140 120,132 Z" fill="#E91E63"/>
                <circle cx="120" cy="132" r="3.5" fill="#C2185B"/>

                <!-- TULIP 1 (Left Pink Tulip) -->
                <g class="tulip-1">
                  <!-- Stem & Leaves -->
                  <path class="tulip-stem" d="M95,110 Q85,80 75,45" stroke="url(#stemGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                  <path d="M92,100 Q70,90 75,70 Q88,85 92,100 Z" fill="#4CAF50"/>
                  
                  <!-- Bloom Petals Group -->
                  <g transform="translate(75, 45)">
                    <!-- Center Petal -->
                    <path class="tulip-petal-center" d="M-10,0 C-12,-20 0,-30 0,-30 C0,-30 12,-20 10,0 Z" fill="#FF8E9E"/>
                    <!-- Outer Left Petal -->
                    <path class="tulip-petal-left" d="M-14,2 C-22,-12 -12,-28 -2,-22 C-2,-10 -6,0 -14,2 Z" fill="url(#tulipRed)"/>
                    <!-- Outer Right Petal -->
                    <path class="tulip-petal-right" d="M14,2 C22,-12 12,-28 2,-22 C2,-10 6,0 14,2 Z" fill="url(#tulipRed)"/>
                  </g>
                </g>

                <!-- TULIP 2 (Center Big Red Tulip) -->
                <g class="tulip-2">
                  <!-- Stem & Leaves -->
                  <path class="tulip-stem" d="M120,110 Q120,70 120,32" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
                  <path d="M120,95 Q140,80 135,60 Q124,75 120,95 Z" fill="#43A047"/>
                  
                  <!-- Bloom Petals Group -->
                  <g transform="translate(120, 32)">
                    <!-- Center Petal -->
                    <path class="tulip-petal-center" d="M-12,0 C-15,-24 0,-36 0,-36 C0,-36 15,-24 12,0 Z" fill="#FF8E9E"/>
                    <!-- Outer Left Petal -->
                    <path class="tulip-petal-left" d="M-16,2 C-26,-15 -14,-32 -2,-26 C-2,-12 -8,0 -16,2 Z" fill="url(#tulipRed)"/>
                    <!-- Outer Right Petal -->
                    <path class="tulip-petal-right" d="M16,2 C26,-15 14,-32 2,-26 C2,-12 8,0 16,2 Z" fill="url(#tulipRed)"/>
                  </g>
                </g>

                <!-- TULIP 3 (Right Yellow/Gold Tulip) -->
                <g class="tulip-3">
                  <!-- Stem & Leaves -->
                  <path class="tulip-stem" d="M145,110 Q155,80 165,48" stroke="url(#stemGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                  <path d="M148,102 Q170,92 165,72 Q152,86 148,102 Z" fill="#4CAF50"/>
                  
                  <!-- Bloom Petals Group -->
                  <g transform="translate(165, 48)">
                    <!-- Center Petal -->
                    <path class="tulip-petal-center" d="M-10,0 C-12,-20 0,-30 0,-30 C0,-30 12,-20 10,0 Z" fill="#FFE082"/>
                    <!-- Outer Left Petal -->
                    <path class="tulip-petal-left" d="M-14,2 C-22,-12 -12,-28 -2,-22 C-2,-10 -6,0 -14,2 Z" fill="url(#tulipYellow)"/>
                    <!-- Outer Right Petal -->
                    <path class="tulip-petal-right" d="M14,2 C22,-12 12,-28 2,-22 C2,-10 6,0 14,2 Z" fill="url(#tulipYellow)"/>
                  </g>
                </g>
              </svg>

              <div class="text-center mt-1">
                <span class="text-xs font-bold text-pink-600 bg-white/80 px-3 py-1 rounded-full shadow-sm border border-pink-200 inline-block animate-pulse">
                  👆 Tap flowers to watch them bloom! 🌸
                </span>
              </div>
            </div>

            <!-- Summary Details Box -->
            <div class="text-left bg-gradient-to-br from-pink-50 to-rose-50 p-4 rounded-2xl border border-pink-200 space-y-2 text-sm text-gray-700 shadow-sm">
              <p class="flex items-center gap-2"><span>📅</span> <strong>When:</strong> ${dateTimeString}</p>
              <p class="flex items-center gap-2"><span>🍽️</span> <strong>Food:</strong> ${formData.food}</p>
              <p class="flex items-center gap-2"><span>🎨</span> <strong>Activity:</strong> ${formData.activity}</p>
              <p class="flex items-center gap-2"><span>👗</span> <strong>What to Wear:</strong> ${formData.wear}</p>
            </div>
            
            <p class="text-xs text-gray-500 font-medium">Clicking confirm will automatically submit your response!</p>
          </div>
        `,
        confirmButtonText: 'Confirm & Send Invitation 💌',
        confirmButtonColor: '#ec4899',
        customClass: {
          popup: 'rounded-3xl border-2 border-pink-200',
          confirmButton: 'rounded-2xl px-6 py-3.5 font-bold shadow-lg shadow-pink-500/30'
        },
        allowOutsideClick: false,
        showLoaderOnConfirm: true,
        preConfirm: async () => {
          document.getElementById('form-willing').value = formData.willing;
          document.getElementById('form-date').value = dateTimeString;
          document.getElementById('form-food').value = formData.food;
          document.getElementById('form-activity').value = formData.activity;
          document.getElementById('form-wear').value = formData.wear;

          try {
            const formElement = document.getElementById('hidden-form');
            const data = new FormData(formElement);
            
            const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
              method: 'POST',
              body: data,
              headers: {
                'Accept': 'application/json'
              }
            });

            if (!response.ok) {
              const errData = await response.json();
              throw new Error(errData.error || 'Submission failed');
            }
            return true;
          } catch (error) {
            Swal.showValidationMessage(`Submission error: ${error.message}`);
          }
        }
      }).then((result) => {
        if (result.isConfirmed) {
          playAudioTone(1046.50, 'sine', 0.4);
          Swal.fire({
            title: 'Response Sent! ❤️',
            imageUrl: dogSvgUrl,
            imageWidth: 90,
            imageHeight: 90,
            text: 'Your date preferences have been sent successfully. See you soon!',
            icon: 'success',
            confirmButtonColor: '#ec4899',
            customClass: {
              popup: 'rounded-3xl border-2 border-pink-200',
              confirmButton: 'rounded-2xl px-6 py-3 font-bold'
            }
          });
        }
      });
    }
  </script>
</body>
</html>
