<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Date Invitation! 🐾</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background: linear-gradient(-45deg, #fff1f2, #ffe4e6, #fecdd3, #fda4af);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .dog-container {
      animation: floatDog 3s ease-in-out infinite;
    }

    @keyframes floatDog {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    /* Floating Heart Effect */
    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.8s ease-out forwards;
      font-size: 1.5rem;
      z-index: 50;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
    }

    /* Fixed positioning so No button can dodge anywhere across the screen */
    #noBtn {
      position: fixed;
      transition: all 0.15s ease-out;
      z-index: 100;
    }

    /* Interactive Tulip Bounce */
    .tulip-interactive {
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .tulip-interactive:hover {
      transform: scale(1.1) rotate(5deg);
    }
    .tulip-interactive:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 relative" onclick="createHeartParticle(event)">

  <!-- Main Interactive Card -->
  <div id="card" class="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-2xl max-w-md w-full text-center space-y-6 border border-pink-200 relative z-10 transition-transform duration-300">
    
    <!-- Animated Golden Retriever Vector -->
    <div class="dog-container flex justify-center">
      <div class="relative bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl shadow-inner inline-block">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" class="w-36 h-36 mx-auto drop-shadow-sm">
          <!-- Body -->
          <path d="M70,120 Q70,90 90,80 L110,80 Q130,90 130,120 L130,160 L70,160 Z" fill="#E5A967"/>
          <!-- Head -->
          <circle cx="100" cy="85" r="45" fill="#F4C085"/>
          <!-- Flappy Ears -->
          <path d="M60,65 Q45,90 60,115 Q70,100 65,80 Z" fill="#D49353"/>
          <path d="M140,65 Q155,90 140,115 Q130,100 135,80 Z" fill="#D49353"/>
          <!-- Snout & Nose -->
          <ellipse cx="100" cy="98" rx="20" ry="15" fill="#FCE8D0"/>
          <ellipse cx="100" cy="93" rx="8" ry="6" fill="#3E2723"/>
          <!-- Eyes -->
          <circle cx="85" cy="75" r="4" fill="#3E2723"/>
          <circle cx="115" cy="75" r="4" fill="#3E2723"/>
          <!-- Tongue -->
          <path d="M93,106 Q100,120 107,106 Z" fill="#FF6B81"/>
          <!-- Paws -->
          <ellipse cx="85" cy="150" rx="10" ry="12" fill="#F4C085"/>
          <ellipse cx="115" cy="150" rx="10" ry="12" fill="#F4C085"/>
        </svg>
        <div class="absolute -top-3 -right-2 text-2xl animate-bounce">💌</div>
      </div>
    </div>

    <div>
      <span class="bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Special Invitation</span>
      <h1 class="text-2xl font-bold text-gray-900 mt-3">Would you be willing to go on a date with me?</h1>
      <p class="text-gray-500 text-sm mt-1">Our golden friend is waiting for your answer! 🐾</p>
    </div>
    
    <div id="button-container" class="flex justify-center items-center gap-4 pt-2 relative min-h-[60px]">
      <button id="yesBtn" onclick="handleYes()" class="bg-pink-500 hover:bg-pink-600 text-white font-semibold px-8 py-3 rounded-2xl shadow-lg hover:shadow-pink-500/40 transition-all transform hover:scale-105 active:scale-95 z-20">
        Yes! 💕
      </button>
      <!-- Elusive No Button: Teleports instantly on mouseover, touchstart, or click -->
      <button id="noBtn" onmouseover="teleportNoBtn(event)" ontouchstart="teleportNoBtn(event)" onclick="teleportNoBtn(event)" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold px-6 py-3 rounded-2xl shadow-md">
        No
      </button>
    </div>
  </div>

  <script>
    let formData = {};

    // 🔴 REPLACE WITH YOUR ACTUAL FORMSPREE FORM ID (e.g. xbo3821n) 🔴
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/YOUR_FORMSPREE_FORM_ID';

    // Reusable Golden Retriever Graphic Data URI for Popups
    const dogSvgUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="90" height="90">
        <circle cx="100" cy="85" r="45" fill="#F4C085"/>
        <path d="M60,65 Q45,90 60,115 Q70,100 65,80 Z" fill="#D49353"/>
        <path d="M140,65 Q155,90 140,115 Q130,100 135,80 Z" fill="#D49353"/>
        <ellipse cx="100" cy="98" rx="20" ry="15" fill="#FCE8D0"/>
        <ellipse cx="100" cy="93" rx="8" ry="6" fill="#3E2723"/>
        <circle cx="85" cy="75" r="4" fill="#3E2723"/>
        <circle cx="115" cy="75" r="4" fill="#3E2723"/>
        <path d="M93,106 Q100,120 107,106 Z" fill="#FF6B81"/>
      </svg>
    `);

    // Sound Synthesizer Effects
    function playAudioTone(freq, type = 'sine', duration = 0.15) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Tap/Click particle animation
    function createHeartParticle(event) {
      if (event.target.tagName === 'BUTTON') return;
      
      const hearts = ['💖', '💕', '🌸', '✨', '🐾', '🌷'];
      const particle = document.createElement('div');
      particle.className = 'heart-particle';
      particle.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      particle.style.left = `${event.clientX - 10}px`;
      particle.style.top = `${event.clientY - 10}px`;
      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 1800);
    }

    // Teleporting "No" Button (No alerts or popups)
    function teleportNoBtn(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      playAudioTone(300, 'triangle', 0.1);
      const noBtn = document.getElementById('noBtn');
      
      const padding = 20;
      const btnWidth = noBtn.offsetWidth || 80;
      const btnHeight = noBtn.offsetHeight || 40;
      
      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;
      
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
      
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    async function handleYes() {
      playAudioTone(587.33, 'sine', 0.2);
      formData.willing = 'Yes';
      const maxDate = '2026-12-20';
      const today = new Date().toISOString().split('T')[0];
      const minDate = today < '2026-01-01' ? '2026-01-01' : today;

      const { value: selectedDate } = await Swal.fire({
        title: 'Yay! 🎉',
        text: 'When are you available? (Until Dec 20, 2026)',
        imageUrl: dogSvgUrl,
        imageWidth: 80,
        imageHeight: 80,
        imageAlt: 'Golden Retriever',
        html: `<input type="date" id="swal-input-date" min="${minDate}" max="${maxDate}" class="swal2-input" value="${minDate <= maxDate ? minDate : maxDate}">`,
        focusConfirm: false,
        confirmButtonText: 'Next ➡️',
        confirmButtonColor: '#ec4899',
        preConfirm: () => {
          const dateVal = document.getElementById('swal-input-date').value;
          if (!dateVal) {
            Swal.showValidationMessage('Please select a valid date!');
          } else if (dateVal > maxDate) {
            Swal.showValidationMessage('Please pick a date on or before December 20, 2026!');
          }
          return dateVal;
        }
      });

      if (selectedDate) {
        formData.date = selectedDate;
        askFoodPreference();
      }
    }

    async function askFoodPreference() {
      playAudioTone(659.25, 'sine', 0.2);
      const { value: foodPreference } = await Swal.fire({
        title: 'What food do you prefer? 🍽️',
        imageUrl: dogSvgUrl,
        imageWidth: 80,
        imageHeight: 80,
        imageAlt: 'Golden Retriever',
        input: 'select',
        inputOptions: {
          'Chinese': 'Chinese 🥢',
          'Filipino': 'Filipino 🇵🇭',
          'Korean': 'Korean 🇰🇷',
          'Japanese': 'Japanese 🍣',
          'Indian': 'Indian 🍛',
          'American': 'American 🍔',
          'Others': 'Others (Please specify)'
        },
        inputPlaceholder: 'Select cuisine type',
        confirmButtonText: 'Next ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) return 'Please pick a food preference!';
        }
      });

      if (foodPreference === 'Others') {
        askOtherFood();
      } else if (foodPreference) {
        formData.food = foodPreference;
        askPreferredActivity();
      }
    }

    async function askOtherFood() {
      playAudioTone(659.25, 'sine', 0.2);
      const { value: customFood } = await Swal.fire({
        title: 'Specify your preferred cuisine 🍕🍝',
        imageUrl: dogSvgUrl,
        imageWidth: 80,
        imageHeight: 80,
        imageAlt: 'Golden Retriever',
        text: 'Type what you are craving for:',
        input: 'text',
        inputPlaceholder: 'e.g., Italian, Mediterranean, Spanish, Thai...',
        showCancelButton: true,
        cancelButtonText: '⬅️ Back',
        confirmButtonText: 'Save & Next ➡️',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value || !value.trim()) {
            return 'Please type your preferred food or cuisine!';
          }
        }
      });

      if (customFood) {
        formData.food = `Others: ${customFood.trim()}`;
        askPreferredActivity();
      } else {
        askFoodPreference();
      }
    }

    async function askPreferredActivity() {
      playAudioTone(783.99, 'sine', 0.2);
      const { value: activity } = await Swal.fire({
        title: 'What is your preferred activity? ✨',
        imageUrl: dogSvgUrl,
        imageWidth: 80,
        imageHeight: 80,
        imageAlt: 'Golden Retriever',
        input: 'select',
        inputOptions: {
          'Artsy': '🎨 Artsy (Museums, Painting, Galleries)',
          'Active': '⚡ Active (Bowling, Arcade, Walking tour)',
          'Calm': '☕ Calm (Coffee shop, Quiet dinner, Strolling)'
        },
        inputPlaceholder: 'Select an activity vibe',
        confirmButtonText: 'Show Summary 💕',
        confirmButtonColor: '#ec4899',
        inputValidator: (value) => {
          if (!value) return 'Please pick an activity!';
        }
      });

      if (activity) {
        formData.activity = activity;
        showSummaryAndTulips();
      }
    }

    function showSummaryAndTulips() {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        setTimeout(() => playAudioTone(freq, 'triangle', 0.3), idx * 150);
      });

      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });

      const formattedDate = new Date(formData.date).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      Swal.fire({
        title: "It's a Date! 🌷✨",
        html: `
          <div class="text-center space-y-3">
            <div class="flex justify-center my-2 tulip-interactive" onclick="playAudioTone(880, 'sine', 0.2); confetti({ particleCount: 30, spread: 50 });">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" class="w-40 h-32 transform transition hover:scale-110">
                <path d="M100,120 Q90,90 80,40" stroke="#4CAF50" stroke-width="4" fill="none"/>
                <path d="M100,120 Q105,85 115,35" stroke="#4CAF50" stroke-width="4" fill="none"/>
                <path d="M100,120 Q80,95 60,50" stroke="#4CAF50" stroke-width="4" fill="none"/>
                <path d="M100,120 Q120,95 140,50" stroke="#4CAF50" stroke-width="4" fill="none"/>
                <path d="M50,45 C45,30 55,20 60,35 C65,20 75,30 70,45 C75,55 55,55 50,45 Z" fill="#FF6B81"/>
                <path d="M70,35 C65,15 85,15 80,35 Z" fill="#FF8E9E"/>
                <path d="M75,30 C70,15 90,10 90,30 C90,45 75,45 75,30 Z" fill="#FF477E"/>
                <path d="M110,25 C110,10 130,15 125,35 C130,20 140,30 135,45 C125,55 110,45 110,25 Z" fill="#FF6B81"/>
                <path d="M135,40 C145,25 155,35 150,50 C155,60 135,60 135,40 Z" fill="#FF8E9E"/>
                <path d="M85,100 L115,100 L125,150 L75,150 Z" fill="#FCE4EC" stroke="#F48FB1" stroke-width="2"/>
                <ellipse cx="100" cy="120" rx="12" ry="8" fill="#E91E63"/>
              </svg>
            </div>
            <p class="text-xs text-pink-500 font-medium">Tap the tulips for extra magic! 🌸</p>

            <div class="text-left bg-pink-50 p-4 rounded-2xl border border-pink-200 space-y-2 text-sm text-gray-700 shadow-sm">
              <p>📅 <strong>Date:</strong> ${formattedDate}</p>
              <p>🍽️ <strong>Food:</strong> ${formData.food}</p>
              <p>🎨 <strong>Activity:</strong> ${formData.activity}</p>
            </div>
            
            <p class="text-xs text-gray-500">Clicking below will confirm and send your answers automatically!</p>
          </div>
        `,
        confirmButtonText: 'Confirm & Send 💌',
        confirmButtonColor: '#ec4899',
        allowOutsideClick: false,
        showLoaderOnConfirm: true,
        preConfirm: async () => {
          try {
            const response = await fetch(FORMSPREE_ENDPOINT, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                Willing: formData.willing,
                "Preferred Date": formattedDate,
                "Food Preference": formData.food,
                "Preferred Activity": formData.activity
              })
            });

            if (!response.ok) {
              const errData = await response.json();
              throw new Error(errData.error || 'Submission failed');
            }
            return true;
          } catch (error) {
            Swal.showValidationMessage(`Error: ${error.message}`);
          }
        }
      }).then((result) => {
        if (result.isConfirmed) {
          playAudioTone(1046.50, 'sine', 0.4);
          Swal.fire({
            title: 'Response Sent! ❤️',
            imageUrl: dogSvgUrl,
            imageWidth: 80,
            imageHeight: 80,
            imageAlt: 'Golden Retriever',
            text: 'Your date preferences have been sent directly to Carlo. See you soon!',
            icon: 'success',
            confirmButtonColor: '#ec4899'
          });
        }
      });
    }
  </script>
</body>
</html>
